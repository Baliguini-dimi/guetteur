name: Qualité

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e ./backend
      - run: pip-audit --require-hashes -r backend/requirements.lock
      - run: ruff check .
        working-directory: backend
      - run: mypy src
        working-directory: backend
      - run: pytest
        working-directory: backend

  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e ./backend
      - name: Générer les secrets de test
        run: |
          set -euo pipefail
          for name in POSTGRES_ADMIN_PASSWORD APP_DATABASE_PASSWORD MIGRATION_DATABASE_PASSWORD BOOTSTRAP_DATABASE_PASSWORD APP_SECRET_KEY; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - name: Démarrer PostgreSQL de test
        run: docker compose -p guetteur-test up -d --wait db
      - name: Appliquer les migrations
        working-directory: backend
        run: DATABASE_MIGRATION_URL="postgresql+psycopg://migration_user:${MIGRATION_DATABASE_PASSWORD}@127.0.0.1:5432/guetteur" alembic upgrade head
      - name: Tester l'isolation entre organisations
        working-directory: backend
        run: |
          TEST_DATABASE_ADMIN_URL="postgresql://guetteur_admin:${POSTGRES_ADMIN_PASSWORD}@127.0.0.1:5432/guetteur" \
          TEST_DATABASE_APP_URL="postgresql://app_user:${APP_DATABASE_PASSWORD}@127.0.0.1:5432/guetteur" \
          TEST_DATABASE_MIGRATION_URL="postgresql://migration_user:${MIGRATION_DATABASE_PASSWORD}@127.0.0.1:5432/guetteur" \
          TEST_DATABASE_BOOTSTRAP_URL="postgresql://bootstrap_user:${BOOTSTRAP_DATABASE_PASSWORD}@127.0.0.1:5432/guetteur" \
          output="$(pytest -m integration -rs 2>&1)" || { status=$?; printf '%s\n' "$output"; exit "$status"; }
          printf '%s\n' "$output"
          if grep -qi skipped <<< "$output"; then
            echo "Des tests d'intégration ont été sautés."
            exit 1
          fi
          if [[ "$output" =~ ([0-9]+)[[:space:]]+passed ]]; then
            count="${BASH_REMATCH[1]}"
          else
            count=0
          fi
          if (( count < 40 )); then
            echo "Au moins 40 tests d'intégration sont requis; résultat: $count."
            exit 1
          fi
      - name: Supprimer la base de test
        if: always()
        run: docker compose -p guetteur-test down -v

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
