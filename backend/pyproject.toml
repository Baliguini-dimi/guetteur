[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guetteur-api"
version = "0.1.0"
description = "API locale de surveillance de sécurité pour Guetteur"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.8.1",
  "sqlalchemy==2.0.40",
  "starlette==1.3.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pip-audit==2.10.1",
  "pytest==8.3.5",
  "ruff==0.11.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
